# trizy project settings (sh assignments). Owned by this project: `trizy update` never touches it.
# The main branch comes from git (origin/HEAD, refreshed by init and update). Set it only to override:
# MAIN_BRANCH=main
# Where `trizy worktree new` puts worktrees (relative to the repo root, outside it by default).
WORKTREE_ROOT=../$(basename "$PWD")-worktrees
# Heavy commands (tests, builds) at once on this machine, across all repositories using the kit.
HEAVY_SLOTS=1
# 1 = every commit needs an independent review receipt (trizy review prepare / verify).
REVIEW_REQUIRED=1
# Branches whose commits skip the receipt because an independent gate reviews them before the merge (deliver packages).
REVIEW_EXEMPT_BRANCHES='deliver/*--*'
# Private test infrastructure per agent (optional): a command printing `export K=V` lines for NAME, and its teardown.
TEST_INFRA_UP=''
TEST_INFRA_DOWN=''
# Formal proofs for pure-math invariants (optional): set to 1 when Lean is installed here (see optimality-check).
LEAN_AVAILABLE=0
# Set by trizy init: track | ignore (agent files in git or in .gitignore), and where trizy update fetches from.
TRIZY_GIT=track
TRIZY_SOURCE=https://github.com/ts-ign0re/trizy.git
TRIZY_REF=main
